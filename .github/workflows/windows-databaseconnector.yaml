on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: Windows DatabaseConnector Tests

permissions: read-all

jobs:
  check:
    name: Windows DatabaseConnector Tests
    runs-on: windows-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DATABASECONNECTOR_JAR_FOLDER: ${{ github.workspace }}/jdbc_drivers
      OMOP_POSTGRES_CONNECTOR_HOST: localhost
      OMOP_POSTGRES_CONNECTOR_PORT: 5432
      OMOP_POSTGRES_CONNECTOR_USER: omop_postgres_connector
      OMOP_POSTGRES_CONNECTOR_PASSWORD: omopverse
      OMOP_POSTGRES_CONNECTOR_DB: omop_test
      TEST_PG_DRIVER: DatabaseConnector

    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          version: 16
          username: omop_postgres_connector
          password: omopverse
          database: omop_test

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Download PostgreSQL JDBC Driver
        shell: bash
        run: |
          mkdir -p ${{ env.DATABASECONNECTOR_JAR_FOLDER }}
          Rscript -e "DatabaseConnector::downloadJdbcDrivers('postgresql')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: "c(\"--no-manual\",\"--compact-vignettes=gs+qpdf\")"
