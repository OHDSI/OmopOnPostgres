on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Windows DatabaseConnector Tests
    runs-on: windows-latest

    env:
      DATABASECONNECTOR_JAR_FOLDER: ${{ github.workspace }}/jdbc_drivers
      OMOP_POSTGRES_CONNECTOR_HOST: localhost
      OMOP_POSTGRES_CONNECTOR_DB: postgres
      OMOP_POSTGRES_CONNECTOR_USER: postgres
      OMOP_POSTGRES_CONNECTOR_PASSWORD: postgres
      OMOP_POSTGRES_CONNECTOR_PORT: 5432
      TEST_PG_DRIVER: DatabaseConnector

    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          version: 14
          username: postgres
          password: postgres
          database: postgres

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install adbc and adbi from R-Universe
        run: |
          try(install.packages(
            c("adbcdrivermanager", "adbcpostgresql"),
            repos = c(CRAN = "https://cloud.r-project.org", ADBC = "https://apache.r-universe.dev")
          ))
          try(install.packages(
            "adbi",
            repos = c(CRAN = "https://cloud.r-project.org", RDBI = "https://r-dbi.r-universe.dev")
          ))
          writeLines(paste0("adbcpostgresql available: ", requireNamespace("adbcpostgresql", quietly = TRUE)))
          writeLines(paste0("adbi available: ", requireNamespace("adbi", quietly = TRUE)))
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::DatabaseConnector
          needs: check

      - name: Download PostgreSQL JDBC Driver
        shell: bash
        run: |
          mkdir -p ${{ env.DATABASECONNECTOR_JAR_FOLDER }}
          Rscript -e "DatabaseConnector::downloadJdbcDrivers('postgresql')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: "c(\"--no-manual\",\"--compact-vignettes=gs+qpdf\")"
