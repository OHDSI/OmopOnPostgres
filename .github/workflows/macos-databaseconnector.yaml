jobs:
  check:
    name: macOS DatabaseConnector
    runs-on: macos-latest

    env:
      DATABASECONNECTOR_JAR_FOLDER: ${{ github.workspace }}/jdbc_drivers

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Java for R
        run: sudo R CMD javareconf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::DatabaseConnector
          needs: check

      - name: Download PostgreSQL JDBC Driver
        run: |
          mkdir -p ${{ env.DATABASECONNECTOR_JAR_FOLDER }}
          Rscript -e "DatabaseConnector::downloadJdbcDrivers('postgresql')"

      - uses: r-lib/actions/check-r-package@v2
