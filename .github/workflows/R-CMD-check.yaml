# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) - ${{ matrix.driver }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
        driver: ['RPostgres', 'adbc']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      OMOP_POSTGRES_CONNECTOR_HOST: localhost
      OMOP_POSTGRES_CONNECTOR_PORT: 5432
      OMOP_POSTGRES_CONNECTOR_USER: omop_postgres_connector
      OMOP_POSTGRES_CONNECTOR_PASSWORD: omopverse
      OMOP_POSTGRES_CONNECTOR_DB: omop_test
      TEST_PG_DRIVER: ${{ matrix.driver }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          version: 16
          username: omop_postgres_connector
          password: omopverse
          database: omop_test

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
